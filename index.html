<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>shdcam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">

<body>
<style>
/* Layout: one-screen camera. Top chips, a framed viewfinder, then a film shelf and the shutter row. Single dark look on purpose (a darkroom), accent is film-box red. */
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --panel: #141416;
  --ink: #f3f0ea;
  --ink2: rgba(243, 240, 234, .64);
  --ink3: rgba(243, 240, 234, .40);
  --line: rgba(255, 255, 255, .10);
  --chip: rgba(255, 255, 255, .08);
  --accent: #e5432a;
  --accent-ink: #ffffff;
  --warn: #f2b441;
  --ok: #4ccf86;
  --font: "Thmanyah Sans", "Readex Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
  --mono: var(--font);
}
* { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; touch-action: pan-x pan-y; }   /* no pinch-zoom of the whole page: the app has its own zoom */
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.35 var(--font);
  overflow: hidden; direction: ltr;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: pan-x pan-y;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg { display: block; }
.mono { font-family: var(--mono); }
.chip, #badge, #vTitle, .row output, #lens button, .rb, .libbtn b { font-variant-numeric: tabular-nums; }
#app { height: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 6px 4px; }

/* top bar */
#top { flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grp { display: flex; align-items: center; gap: 4px; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--chip); font: 500 12px/1 var(--mono); letter-spacing: .05em; color: var(--ink); }
.chip.live { color: var(--ok); }
.ib { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink); flex: none; }
.ib svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ib.on { color: var(--warn); }
.ib.sm { width: 34px; height: 34px; border-radius: 17px; background: rgba(0, 0, 0, .42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ib.sm svg { width: 19px; height: 19px; }
.ib.big { width: 52px; height: 52px; border-radius: 26px; background: var(--chip); }
.ib.big svg { width: 26px; height: 26px; }
.ib.pri { background: var(--accent); color: var(--accent-ink); }
.ib[disabled] { opacity: .35; pointer-events: none; }
[hidden] { display: none !important; }

/* viewfinder */
#stage { flex: 1 1 0; min-height: 0; position: relative; }
#frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #000; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#grid { position: absolute; inset: 0; pointer-events: none; display: none; }
#grid i { position: absolute; background: rgba(255, 255, 255, .34); }
#grid i:nth-child(1) { left: 33.333%; top: 0; bottom: 0; width: 1px; }
#grid i:nth-child(2) { left: 66.666%; top: 0; bottom: 0; width: 1px; }
#grid i:nth-child(3) { top: 33.333%; left: 0; right: 0; height: 1px; }
#grid i:nth-child(4) { top: 66.666%; left: 0; right: 0; height: 1px; }
body.grid #grid { display: block; }
#ring { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border: 1.5px solid var(--warn); border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(1.5); }
#ring.go { animation: ring 1.1s ease-out forwards; }
@keyframes ring { 0% { opacity: 0; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
#badge { position: absolute; left: 10px; top: 10px; padding: 5px 9px; border-radius: 9px; background: rgba(0, 0, 0, .5); font: 500 11px/1 var(--mono); letter-spacing: .06em; color: var(--ink); max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#badge.rec { color: #fff; background: var(--accent); }
#badge:empty { display: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
#count { position: absolute; inset: 0; display: grid; place-items: center; font: 200 120px/1 var(--font); color: #fff; text-shadow: 0 2px 24px rgba(0, 0, 0, .55); pointer-events: none; }
#count:empty { display: none; }
#btnPlay { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(0, 0, 0, .5); display: grid; place-items: center; color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#btnPlay svg { width: 26px; height: 26px; fill: currentColor; stroke: none; margin-left: 3px; }
#vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .22); pointer-events: none; }
#vprog i { display: block; height: 100%; width: 0; background: var(--accent); }
#btnCmp { position: absolute; right: 10px; top: 10px; }
#lens { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 22px; background: rgba(0, 0, 0, .46); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#lens button { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px; font: 500 11px/1 var(--mono); color: var(--ink2); }
#lens button.on { background: var(--accent); color: var(--accent-ink); }
#corner { position: absolute; right: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.rb { width: 36px; height: 36px; border-radius: 50%; background: rgba(0, 0, 0, .46); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: grid; place-items: center; font: 600 13px/1 var(--mono); color: var(--ink); }
.rb svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; }
.rb.on { background: var(--ink); color: #000; }
#hint { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font: 400 12px/1.4 var(--font); color: var(--ink2); text-shadow: 0 1px 8px rgba(0, 0, 0, .8); pointer-events: none; direction: rtl; }
body.live #hint, #hint:empty { display: none; }
#nm { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font: 600 22px/1 var(--font); color: #fff; text-shadow: 0 2px 18px rgba(0, 0, 0, .7); opacity: 0; pointer-events: none; transition: opacity .25s; }
#nm.show { opacity: 1; }

/* bottom panel */
#panel { flex: none; display: flex; flex-direction: column; gap: 6px; }
#tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
#tabs::-webkit-scrollbar, #shelf::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 34px; min-width: 36px; padding: 0 15px; border-radius: 12px; background: var(--chip); font: 600 14px/1 var(--font); color: var(--ink2); display: grid; place-items: center; }
.tab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.icon { padding: 0; width: 38px; }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.tab.icon.on { background: var(--ink); color: #000; }
.tab.star.on svg { fill: currentColor; }
#shelf { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding: 6px 2px 2px; min-height: 100px; align-items: flex-start; }
.it { flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px; scroll-snap-align: center; color: var(--ink3); position: relative; }
.it .art { height: 62px; display: grid; place-items: end center; transition: transform .2s; }
.it .art svg { height: 62px; width: auto; }
.can text { font-family: var(--font); font-weight: 700; }
.it .nm { font: 500 11px/1.15 var(--font); text-align: center; height: 26px; overflow: hidden; width: 100%; }
.it.on { color: var(--ink); }
.it.on .art { transform: translateY(-3px) scale(1.07); filter: drop-shadow(0 7px 10px rgba(0, 0, 0, .65)); }
.it .sw { width: 56px; height: 56px; border-radius: 15px; overflow: hidden; background: #222; border: 2px solid transparent; display: block; transition: border-color .15s; }
.it .sw canvas { width: 100%; height: 100%; display: block; }
.it.on .sw { border-color: var(--ink); }
.it .fv { position: absolute; top: -4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .65); color: var(--ink2); display: none; place-items: center; }
.it .fv svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
.it.on .fv { display: grid; }
.it .fv.is { color: var(--warn); }
.it .fv.is svg { fill: currentColor; }
#empty { padding: 26px 8px; width: 100%; text-align: center; color: var(--ink3); direction: rtl; font-size: 13px; }
#modes { display: flex; justify-content: center; gap: 26px; }
#modes button { font: 500 13px/1 var(--font); color: var(--ink3); padding: 6px 4px 8px; position: relative; }
#modes button.on { color: var(--ink); }
#modes button.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
#srow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px 2px; }
#btnShutter { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; transition: transform .12s; }
#btnShutter i { width: 58px; height: 58px; border-radius: 50%; background: var(--ink); transition: all .2s; }
#btnShutter:active { transform: scale(.93); }
body[data-mode="video"] #btnShutter i { background: var(--accent); }
body.rec #btnShutter i { width: 28px; height: 28px; border-radius: 8px; }
.libbtn { justify-self: start; width: 52px; height: 52px; border-radius: 14px; background: var(--chip) center / cover no-repeat; display: grid; place-items: center; position: relative; overflow: hidden; color: var(--ink); }
.libbtn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.libbtn b { position: absolute; right: 3px; bottom: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: rgba(0, 0, 0, .7); font: 500 11px/18px var(--mono); text-align: center; }
#btnSide { justify-self: end; }

/* sheets */
#scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 560px; margin-inline: auto; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -14px 44px rgba(0, 0, 0, .55); padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); transform: translateY(106%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); max-height: 82%; overflow-y: auto; direction: rtl; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheet h2 { margin: 0 0 4px; font: 600 16px/1.3 var(--font); }
.sheet .sub { color: var(--ink3); font-size: 12px; margin: 0 0 6px; }
.segs { display: flex; gap: 6px; margin: 8px 0 6px; }
.segs button { flex: 1; height: 36px; border-radius: 11px; background: var(--chip); color: var(--ink2); font: 500 13px/1 var(--font); }
.segs button.on { background: var(--ink); color: #000; }
.row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: 10px; margin: 6px 0; }
.row label { font: 500 13px/1.2 var(--font); color: var(--ink2); }
.row output { font: 500 12px/1 var(--mono); color: var(--ink); text-align: left; direction: ltr; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 30px; background: transparent; width: 100%; margin: 0; direction: ltr; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--p, 50%), rgba(255, 255, 255, .18) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); margin-top: -9.5px; box-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .18); }
input[type=range]::-moz-range-progress { height: 3px; background: var(--ink); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--ink); }
.tg { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font: 500 14px/1.3 var(--font); width: 100%; text-align: right; }
.tg i { width: 44px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, .16); position: relative; transition: background .18s; flex: none; }
.tg i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .18s; }
.tg.on i { background: var(--accent); }
.tg.on i::after { transform: translateX(18px); }
.btnw { width: 100%; height: 44px; border-radius: 13px; background: var(--chip); font: 500 14px/1 var(--font); margin-top: 10px; }
.btnw.pri { background: var(--accent); color: var(--accent-ink); }
.info { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); color: var(--ink2); font: 500 12px/1.65 var(--mono); white-space: pre-line; direction: rtl; unicode-bidi: plaintext; text-align: start; -webkit-user-select: text; user-select: text; word-break: break-word; }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(242, 180, 65, .1); color: var(--warn); font-size: 12.5px; line-height: 1.5; }

/* viewer + overlays */
#viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: none; flex-direction: column; padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(12px, env(safe-area-inset-left, 0px)); direction: ltr; }
#viewer.open { display: flex; }
#vTop { display: flex; align-items: center; justify-content: space-between; height: 52px; flex: none; }
#vTitle { font: 500 12px/1 var(--mono); color: var(--ink2); }
#vBody { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
#vBody img, #vBody video { max-width: 100%; max-height: 100%; border-radius: 12px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
#vNav { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#vNav button { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .12); display: grid; place-items: center; }
#vNav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#vBot { flex: none; display: flex; gap: 10px; padding: 12px 0 14px; direction: rtl; }
#vBot button { flex: 1; height: 48px; border-radius: 14px; background: var(--chip); font: 500 14px/1 var(--font); display: grid; place-items: center; }
#vBot .pri { background: var(--accent); color: #fff; flex: 2; }
#vMsg { text-align: center; color: var(--warn); font-size: 12.5px; padding: 0 0 8px; direction: rtl; }
#vMsg:empty { display: none; }
#bake { position: fixed; inset: 0; z-index: 50; background: rgba(8, 8, 9, .96); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; direction: rtl; }
#bake.open { display: flex; }
#bakeCv { max-width: 62%; max-height: 46%; border-radius: 12px; overflow: hidden; display: grid; }
#bakeCv canvas { max-width: 100%; max-height: 100%; width: auto !important; height: auto !important; }
#bakeTxt { font: 600 17px/1.3 var(--font); }
#bakeBar { width: min(320px, 80%); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; }
#bakeBar i { display: block; height: 100%; width: 0; background: var(--accent); }
#bakeSub { color: var(--ink3); font-size: 12.5px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); transform: translate(-50%, -10px); z-index: 60; max-width: 88%; padding: 10px 16px; border-radius: 18px; background: rgba(34, 34, 37, .96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font: 500 13px/1.35 var(--font); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; direction: rtl; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
<div id="app">
  <header id="top">
    <div class="grp">
      <button class="chip" id="btnFmt" type="button" aria-label="الجودة">JPG</button>
      <button class="chip" id="btnAspect" type="button" aria-label="نسبة الأبعاد">ORIG</button>
      <button class="chip live" id="btnLive" type="button" aria-label="المعاينة الحية" hidden>LIVE</button>
    </div>
    <div class="grp">
      <button class="ib" id="btnFlash" type="button" aria-label="الفلاش" hidden></button>
      <button class="ib" id="btnTimer" type="button" aria-label="المؤقت" hidden></button>
      <button class="ib" id="btnImport" type="button" aria-label="اختيار من المعرض"></button>
      <button class="ib" id="btnSet" type="button" aria-label="الإعدادات"></button>
    </div>
  </header>

  <main id="stage">
    <div id="frame">
      <canvas id="view"></canvas>
      <div id="grid"><i></i><i></i><i></i><i></i></div>
      <div id="ring"></div>
      <div id="nm"></div>
      <div id="badge"></div>
      <div id="flash"></div>
      <div id="count"></div>
      <button id="btnPlay" type="button" aria-label="تشغيل" hidden></button>
      <div id="vprog" hidden><i></i></div>
      <button class="ib sm" id="btnCmp" type="button" aria-label="اضغط مطولًا لمقارنة الأصل"></button>
      <div id="hint"></div>
      <div id="lens" hidden></div>
      <div id="corner">
        <button class="rb" id="btnM" type="button" aria-label="الضبط">M</button>
        <button class="rb" id="btnGrid" type="button" aria-label="الشبكة"></button>
      </div>
    </div>
  </main>

  <section id="panel">
    <div id="tabs" role="tablist"></div>
    <div id="shelf"></div>
    <div id="modes">
      <button type="button" data-mode="photo" class="on">صورة</button>
      <button type="button" data-mode="video">فيديو</button>
    </div>
    <div id="srow">
      <button class="libbtn" id="btnLib" type="button" aria-label="المكتبة"></button>
      <button id="btnShutter" type="button" aria-label="التقاط"><i></i></button>
      <button class="ib big" id="btnSide" type="button" aria-label="قلب الكاميرا"></button>
    </div>
  </section>
</div>

<div id="scrim"></div>

<section class="sheet" id="shSet" aria-label="الإعدادات">
  <div class="grab"></div>
  <h2>الإعدادات</h2>
  <div id="setBody"></div>
</section>

<section class="sheet" id="shPro" aria-label="الضبط">
  <div class="grab"></div>
  <div class="segs" id="proTabs">
    <button type="button" data-p="adj" class="on">ضبط الصورة</button>
    <button type="button" data-p="fx">تأثيرات الفيلم</button>
    <button type="button" data-p="cam" hidden>الكاميرا</button>
  </div>
  <div id="proBody"></div>
</section>

<div id="viewer" role="dialog" aria-label="المكتبة">
  <div id="vTop">
    <button class="ib" id="vClose" type="button" aria-label="إغلاق"></button>
    <div id="vTitle"></div>
    <button class="ib" id="vDel" type="button" aria-label="حذف"></button>
  </div>
  <div id="vBody"><div id="vNav"><button type="button" id="vPrev" aria-label="السابق"></button><button type="button" id="vNext" aria-label="التالي"></button></div></div>
  <div id="vMsg"></div>
  <div id="vBot">
    <button type="button" id="vShare">مشاركة</button>
    <button type="button" id="vSave" class="pri">حفظ في الجهاز</button>
  </div>
</div>

  lookId: FILMS.byId[savedLook] ? savedLook : FILMS.DEFAULT, prevLook: FILMS.DEFAULT,
  favs: (store.get('favs', []) || []).filter(id => FILMS.byId[id]),
  aspect: store.get('aspect', 'orig'),
  adj: Object.assign({}, DEF_ADJ, store.get('adj', {})),

  src: null, live: null, lib: [], bypass: false, seed: 1,
  timer: 0, flash: false, facing: 'environment', zoom: 1, cx: 0.5, cy: 0.5,
  rec: null, baking: false, canLive: false, shooting: false

if (S.lookId !== 'none') S.prevLook = S.lookId;

/* ---------- looks ---------- */
const lutCache = new Map();
const thumbLut = {};
function look(id) {
  const it = FILMS.byId[id] || FILMS.byId[FILMS.DEFAULT];
  if (!it._p) it._p = FL.prep(it.look || {});
  return it;
}
function lutFor(id) {

    if (lutCache.size > 10) lutCache.delete(lutCache.keys().next().value);
  }

}
function paramsFor(o) {
  o = o || {};
  const base = { zoom: o.zoom || 1, cx: o.cx == null ? S.cx : o.cx, cy: o.cy == null ? S.cy : o.cy, mirror: !!o.mirror };
  if (S.bypass) return Object.assign(base, { ev: 0, wb: [1, 1, 1], intensity: 0, con: 1, sat: 1, grain: 0, glow: 0, hal: 0, vig: 0, seed: 1 });
  const it = look(S.lookId), fx = it._p.fx, a = S.adj, none = S.lookId === 'none', k = none ? 0 : 1;
  let wb = [1 + 0.30 * a.temp, 1, 1 - 0.30 * a.temp];
  wb[1] *= 1 - 0.20 * a.tint; wb[0] *= 1 + 0.07 * a.tint; wb[2] *= 1 + 0.07 * a.tint;
  const yl = 0.2126 * wb[0] + 0.7152 * wb[1] + 0.0722 * wb[2];
  wb = wb.map(v => v / yl);
  return Object.assign(base, {
    ev: a.ev, wb, intensity: none ? 0 : a.int, con: a.con, sat: a.sat,
    grain: k * fx.grain * a.grain, gsize: fx.gsize, gchroma: fx.gchroma,
    glow: k * fx.glow * a.glow, hal: k * fx.hal * a.glow, halCol: fx.halCol, vig: k * fx.vig * a.vig,
    seed: o.seed == null ? S.seed : o.seed

}

/* ---------- engines ---------- */
let view = null, exp = null, glFail = false;
function getView() {
  if (view) return view;
  try {
    view = new FilmEngine($('#view'));
    view.onrestore = () => { try { view = null; getView(); layout(); if (S.src) uploadNow(); } catch (e) { /* ignore */ } };
  } catch (e) {
    glFail = true;
    $('#hint').textContent = 'المتصفح لا يدعم WebGL2 المطلوب لتشغيل الفلاتر.';
  }

}
function getExp() {
  if (!exp) exp = new FilmEngine(document.createElement('canvas'), { preserve: true });
  return exp;
}
function bindLut(e) {
  if (e._lut !== S.lookId) { e.setLUT(lutFor(S.lookId), 33); e._lut = S.lookId; }
}

/* ---------- aspect & layout ---------- */
const ASPECTS = ['orig', '4:3', '16:9', '1:1'];
function srcAspect() { const s = S.src; return s && s.w && s.h ? s.w / s.h : 3 / 4; }
function outAspect(sa) {
  const o = S.aspect;
  if (o === 'orig' || !o) return sa;
  if (o === '1:1') return 1;
  const r = o === '16:9' ? 16 / 9 : 4 / 3;
  return sa < 1 ? 1 / r : r;
}
function aspectLabel() {
  if (S.aspect !== 'orig') return S.aspect;
  const a = srcAspect(), r = a < 1 ? 1 / a : a;
  const t = [[4 / 3, '4:3'], [16 / 9, '16:9'], [3 / 2, '3:2'], [1, '1:1']];
  for (const x of t) if (Math.abs(r - x[0]) < 0.04) return x[1];
  return 'ORIG';
}
function canvasLong() {
  if (S.live && S.mode === 'video') return S.set.vq === 720 ? 1280 : 1920;
  return 1280;
}
function layout() {
  const e = getView();
  if (!e) return;
  const st = $('#stage').getBoundingClientRect();
  if (!st.width || !st.height) return;
  const A = outAspect(srcAspect());
  let w = st.width, h = w / A;
  if (h > st.height) { h = st.height; w = h * A; }
  const fr = $('#frame');
  fr.style.width = Math.round(w) + 'px'; fr.style.height = Math.round(h) + 'px';
  const L = canvasLong();
  const W = A >= 1 ? L : Math.round(L * A), H = A >= 1 ? Math.round(L / A) : L;
  e.setSize(even(W), even(H));
  if (S.src) { uploadNow(); redraw(); }
  const lbl = aspectLabel();
  if ($('#btnAspect').textContent !== lbl) $('#btnAspect').textContent = lbl;
}

/* ---------- render ---------- */
let rafP = 0, loopId = 0;
function uploadNow() {
  const s = S.src, e = view;
  if (!s || !e) return;
  const el = s.el;
  const w = el.videoWidth || s.w, h = el.videoHeight || s.h;
  if (el.readyState === 0 && el.tagName === 'VIDEO') return;
  e.upload(el, w, h);
}
function redraw() {
  if (rafP) return;
  rafP = requestAnimationFrame(() => { rafP = 0; drawNow(); });
}
function drawNow() {
  const e = view;
  if (!e || !S.src) return;
  bindLut(e);
  const L = S.live;
  e.render(paramsFor({ zoom: L ? L.sw : 1, mirror: !!L && S.facing === 'user' && S.set.mirror }));
  if (S.snap) { const f = S.snap; S.snap = null; try { f(e.canvas); } catch (x) { /* ignore */ } }
}
function startLoop(v) {
  const id = ++loopId;
  const step = () => {
    if (id !== loopId) return;
    if (v.readyState >= 2 && v.videoWidth && view) {
      if (S.src && S.src.el === v && (S.src.w !== v.videoWidth || S.src.h !== v.videoHeight)) { S.src.w = v.videoWidth; S.src.h = v.videoHeight; layout(); }
      view.upload(v, v.videoWidth, v.videoHeight);
      S.seed = (S.seed + 1) % 99991;
      drawNow();
      if (S.src && S.src.kind === 'video') updateProg(v);
    }
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(step); else requestAnimationFrame(step);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(step); else requestAnimationFrame(step);
}
function stopLoop() { loopId++; }
function updateProg(v) {
  const p = $('#vprog');
  if (!p.hidden && v.duration) p.firstElementChild.style.width = (100 * v.currentTime / v.duration).toFixed(1) + '%';
  $('#btnPlay').hidden = !v.paused;
}

function releaseSource(s) {
  if (!s) return;
  try {
    if (s.kind === 'image' || s.kind === 'sample') { if (s.el && s.el.close) s.el.close(); if (s.full && s.full !== s.el && s.full.close) s.full.close(); }
    else if (s.kind === 'video') { s.el.pause(); s.el.removeAttribute('src'); s.el.load(); if (s.url) URL.revokeObjectURL(s.url); }
  } catch (e) { /* ignore */ }
}
function setSource(src, keepOld) {
  stopLoop();
  const prev = S.src;
  S.src = src;
  if (prev && prev !== src && !keepOld) releaseSource(prev);
  const isV = src.kind === 'video', isL = src.kind === 'live';
  $('#vprog').hidden = !isV;
  $('#vprog').firstElementChild.style.width = '0';
  $('#btnPlay').hidden = !isV || !src.el.paused;
  layout();
  if (isV || isL) startLoop(src.el);
  refreshThumb();
  updateUI();
}

  if (!S.set.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const click = (delay, gain) => {
      const n = Math.floor(actx.sampleRate * 0.06), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const s = actx.createBufferSource(); s.buffer = buf;
      const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.9;
      const g = actx.createGain(); g.gain.value = gain;
      s.connect(f); f.connect(g); g.connect(actx.destination); s.start(actx.currentTime + delay);
    };
    click(0, 0.55); click(0.075, 0.35);

/* ---------- tabs & shelf ---------- */
function listFor(cat) {
  if (cat === 'fav') return S.favs.map(id => FILMS.byId[id]).filter(Boolean);
  const c = FILMS.CATS.find(x => x.id === cat);
  return c ? c.items : [];
}
function buildTabs() {
  const t = $('#tabs');
  t.textContent = '';
  const mk = (cls, html, key) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab ' + cls; b.innerHTML = html; b.dataset.k = key; b.setAttribute('role', 'tab');
    t.appendChild(b);
  };
  mk('icon none', IC.none, 'none');
  mk('icon star', IC.star, 'fav');
  FILMS.CATS.forEach(c => mk('', c.name, c.id));
  updateTabs();
}
function updateTabs() {
  $$('#tabs .tab').forEach(b => {
    const k = b.dataset.k;
    b.classList.toggle('on', k === 'none' ? S.lookId === 'none' : k === S.cat);
    b.setAttribute('aria-selected', b.classList.contains('on') ? 'true' : 'false');
  });
}
function buildShelf() {
  const sh = $('#shelf');
  sh.textContent = '';
  const items = listFor(S.cat);
  if (!items.length) {
    const d = document.createElement('div'); d.id = 'empty'; d.textContent = 'اختر فلترًا واضغط ★ لإضافته هنا';
    sh.appendChild(d);
    return;
  }
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'it' + (it.id === S.lookId ? ' on' : ''); b.dataset.id = it.id;
    const art = document.createElement('div'); art.className = 'art';
    if (it.art) art.innerHTML = canArt(it.art);
    else {
      const sw = document.createElement('span'); sw.className = 'sw';
      const cv = document.createElement('canvas'); cv.width = 56; cv.height = 56;
      sw.appendChild(cv); art.appendChild(sw);
    }
    b.appendChild(art);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name; b.appendChild(nm);
    const fv = document.createElement('span');
    fv.className = 'fv' + (S.favs.includes(it.id) ? ' is' : ''); fv.dataset.fav = it.id; fv.innerHTML = IC.star;
    b.appendChild(fv);
    sh.appendChild(b);
  });
  paintSwatches();
  scrollToActive(false);
}
function scrollToActive(smooth) {
  const sh = $('#shelf'), a = $('.it.on', sh);
  if (!a) { sh.scrollLeft = 0; return; }
  sh.scrollTo({ left: a.offsetLeft - (sh.clientWidth - a.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
}
function syncShelf() {
  const items = listFor(S.cat);
  if (!$$('#shelf .it').length || items.length !== $$('#shelf .it').length) { buildShelf(); return; }
  $$('#shelf .it').forEach(b => b.classList.toggle('on', b.dataset.id === S.lookId));
  scrollToActive(true);
}
let thumb = null;
function refreshThumb() {
  const s = S.src;
  if (!s || !s.el) return;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 56;
    const x = c.getContext('2d', { willReadFrequently: true });
    const w = s.el.videoWidth || s.w, h = s.el.videoHeight || s.h, m = Math.min(w, h);
    x.drawImage(s.el, (w - m) / 2, (h - m) / 2, m, m, 0, 0, 56, 56);
    thumb = x.getImageData(0, 0, 56, 56);
    paintSwatches();
  } catch (e) { /* source not ready */ }
}
function paintSwatches() {
  if (!thumb) return;
  $$('#shelf .sw canvas').forEach(cv => {
    const id = cv.closest('.it').dataset.id, x = cv.getContext('2d'), out = x.createImageData(56, 56);
    let lut = thumbLut[id];
    if (!lut) lut = thumbLut[id] = FL.buildLUT(look(id)._p, 17);
    const d = thumb.data, o = out.data, t = [0, 0, 0];
    for (let i = 0; i < d.length; i += 4) {
      FL.lutApply(lut, 17, d[i] / 255, d[i + 1] / 255, d[i + 2] / 255, t);
      o[i] = t[0] * 255; o[i + 1] = t[1] * 255; o[i + 2] = t[2] * 255; o[i + 3] = 255;
    }
    x.putImageData(out, 0, 0);
  });
}
function selectLook(id, opts) {
  opts = opts || {};
  if (!FILMS.byId[id]) return;
  if (id !== 'none') S.prevLook = id;
  S.lookId = id; store.set('look', id);
  if (id !== 'none' && S.cat !== 'fav') S.cat = FILMS.byId[id].cat;
  updateTabs(); syncShelf(); redraw();
  if (!opts.silent) { flashName(look(id).name); tick(); }
}
function stepLook(dir) {
  let items = listFor(S.cat);
  if (!items.length) items = listFor('film');
  const i = items.findIndex(x => x.id === S.lookId);
  const n = items[(i < 0 ? (dir > 0 ? 0 : items.length - 1) : (i + dir + items.length) % items.length)];
  if (n) selectLook(n.id);
}
function toggleFav(id) {
  const i = S.favs.indexOf(id);
  if (i >= 0) S.favs.splice(i, 1); else S.favs.push(id);
  store.set('favs', S.favs);
  if (S.cat === 'fav') buildShelf();
  else $$('#shelf .fv').forEach(f => f.classList.toggle('is', S.favs.includes(f.dataset.fav)));
  toast(i >= 0 ? 'أُزيل من المفضلة' : 'أُضيف للمفضلة ★', 1400);
}

const PREVIEW_LONG = 1920;
const isImg = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|avif|gif|bmp)$/i.test(f.name || '');
const isVid = f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp|mkv)$/i.test(f.name || '');
const dimW = el => el.naturalWidth || el.videoWidth || el.width || 0;
const dimH = el => el.naturalHeight || el.videoHeight || el.height || 0;
const onceEv = (el, ev, ms) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout:' + ev)), ms || 15000);
  el.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
  el.addEventListener('error', () => { clearTimeout(t); rej(new Error('media error')); }, { once: true });
});

async function decodeImage(blob) {
  try { return await createImageBitmap(blob); } catch (e) { /* fall back to <img> */ }
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    img.decoding = 'async'; img.src = url;
    await img.decode();
    return img;
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
async function previewOf(full) {
  const w = dimW(full), h = dimH(full), L = Math.max(w, h);
  if (L <= PREVIEW_LONG) return full;
  const k = PREVIEW_LONG / L, rw = Math.round(w * k), rh = Math.round(h * k);
  try { return await createImageBitmap(full, { resizeWidth: rw, resizeHeight: rh, resizeQuality: 'high' }); }
  catch (e) {
    const c = document.createElement('canvas'); c.width = rw; c.height = rh;
    c.getContext('2d').drawImage(full, 0, 0, rw, rh);
    return c;
  }
}

/* ---------- sources ---------- */
async function loadImageBlob(blob, name, kind) {
  const full = await decodeImage(blob);
  const fw = dimW(full), fh = dimH(full);
  if (!fw || !fh) throw new Error('empty image');
  const pv = await previewOf(full);
  if (pv !== full && full.close) full.close();
  if (S.live) stopLive(true);
  const src = { kind: kind || 'image', el: pv, w: dimW(pv), h: dimH(pv), fw, fh, name: name || 'image', blob };
  setSource(src);
  return src;
}
async function loadVideoBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
  v.src = url;
  try { await onceEv(v, 'loadeddata', 20000); }
  catch (e) { URL.revokeObjectURL(url); throw e; }
  if (S.live) stopLive(true);
  const src = { kind: 'video', el: v, w: v.videoWidth, h: v.videoHeight, name: name || 'video', url, blob, dur: v.duration };
  setSource(src);
  try { await v.play(); } catch (e) { $('#btnPlay').hidden = false; }
  return src;
}
async function loadSample() {
  const bin = atob(SAMPLE_B64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return loadImageBlob(new Blob([u], { type: 'image/jpeg' }), 'sample.jpg', 'sample');
}

/* ---------- export geometry ---------- */
function exportDims(w, h, zoom, cap) {
  const sa = w / h, A = outAspect(sa);
  let rw, rh;
  if (sa > A) { rh = h; rw = h * A; } else { rw = w; rh = w / A; }
  rw /= zoom; rh /= zoom;
  const k = Math.min(1, cap / Math.max(rw, rh));
  return [even(rw * k), even(rh * k)];
}
function stampCanvas(src, W, H) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  const d = new Date(), txt = "'" + String(d.getFullYear()).slice(2) + '  ' + (d.getMonth() + 1) + '  ' + d.getDate();
  const fs = Math.round(Math.min(W, H) * 0.036);
  x.font = '500 ' + fs + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  x.textAlign = 'right'; x.textBaseline = 'alphabetic';
  const px = W - fs * 1.5, py = H - fs * 1.3;
  x.shadowColor = 'rgba(255,80,0,.7)'; x.shadowBlur = fs * 0.4; x.fillStyle = '#ff9a2e';
  x.fillText(txt, px, py);
  x.shadowBlur = 0; x.fillText(txt, px, py);
  return c;
}
const toBlobP = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));

/* render one frame/photo at export size through the film pipeline -> JPEG blob */
async function renderPhoto(el, w, h, o) {
  o = o || {};
  const e = getExp(), zoom = o.zoom || 1;
  if (Math.max(w, h) > e.maxTex) {
    const k = e.maxTex / Math.max(w, h), rw = Math.floor(w * k), rh = Math.floor(h * k);
    const small = await createImageBitmap(el, { resizeWidth: rw, resizeHeight: rh, resizeQuality: 'high' });
    try { return await renderPhoto(small, rw, rh, o); } finally { if (small.close) small.close(); }
  }
  let cap = Math.min(S.set.photoCap || 4096, e.maxTex, 8192), last = null;
  for (let tries = 0; tries < 3; tries++) {
    try {
      const d = exportDims(w, h, zoom, cap);
      e.setSize(d[0], d[1]);
      bindLut(e);
      e.upload(el, w, h);
      e.render(paramsFor({ zoom, cx: o.cx, cy: o.cy, mirror: o.mirror, seed: (Math.random() * 90000) | 0 }));
      let cv = e.canvas;
      if (S.set.stamp && !S.bypass) cv = stampCanvas(cv, d[0], d[1]);
      const blob = await toBlobP(cv, 'image/jpeg', 0.93);
      if (!blob) throw new Error('encode failed');
      const thumb = makeThumb(cv, d[0], d[1]);
      return { blob, w: d[0], h: d[1], thumb };
    } catch (err) { last = err; cap = Math.round(cap / 2); e.srcW = 0; e.srcH = 0; }
  }
  throw last || new Error('render failed');
}
function makeThumb(cv, w, h) {
  try {
    const k = 132 / Math.max(w, h), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext('2d').drawImage(cv, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.7);
  } catch (err) { return ''; }
}
async function bakeBlob(blob) {
  const bmp = await decodeImage(blob);
  try { return await renderPhoto(bmp, dimW(bmp), dimH(bmp), {}); }
  finally { if (bmp.close) bmp.close(); }
}

/* ---------- naming ---------- */
function stampName(ts) {
  const d = new Date(ts);
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function fileNameFor(ext, ts, lookId) {
  const n = look(lookId || S.lookId).name || 'Look';
  const tag = n.replace(/[^A-Za-z0-9]+/g, '') || 'Look';

/* ---------- saving to the device ---------- */
function anchorDownload(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 5000);
}
/* resolves: saved | declined | busy | failed | manual */
async function saveBlob(blob, filename) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); return 'saved'; }
      catch (e) {
        const c = e && e.code;
        if (c === 'declined') return 'declined';
        if (c === 'rate_limited') return 'busy';
        if (c === 'too_large' || c === 'bad_request' || c === 'rejected_extension' || c === 'extension_not_enabled') return 'failed';
      }
    }
  }
  if (!EMBEDDED) { try { anchorDownload(blob, filename); return 'saved'; } catch (e) { return 'failed'; } }
  return 'manual';
}
async function deliver(it, quiet) {
  const blob = await libBlob(it);
  if (!blob) { toast('تعذّر قراءة الملف'); return 'failed'; }
  const r = await saveBlob(blob, it.name);
  if (quiet) return r;
  if (r === 'saved') toast('تم الحفظ في جهازك ✓');
  else if (r === 'declined') toast('محفوظة في المكتبة. اضغط على المعرض لحفظها لاحقًا');
  else if (r === 'busy') toast('انتظر لحظة ثم أعد المحاولة');
  else if (r === 'manual') { openViewer(0, 'اضغط مطولًا على الصورة واختر «تنزيل الصورة» لحفظها في الجهاز'); }
  else toast('تعذّر الحفظ، افتح المكتبة وحاول من هناك');
  return r;
}

/* ---------- library (IndexedDB, falls back to memory) ---------- */
let dbP = null;
function idb() {
  if (dbP) return dbP;
  dbP = new Promise(res => {
    try {
      const r = indexedDB.open('shdcam', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blob')) d.createObjectStore('blob');
        if (!d.objectStoreNames.contains('fonts')) d.createObjectStore('fonts', { keyPath: 'w' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return dbP;
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function libLoad() {
  const d = await idb();
  if (!d) return;
  try {
    const all = await reqP(d.transaction('meta').objectStore('meta').getAll());
    const keep = S.lib.filter(x => x.mem);
    S.lib = keep.concat(all).sort((a, b) => b.ts - a.ts);
    updateUI();
  } catch (e) { /* ignore */ }
}
async function libAdd(it, blob) {
  S.lib.unshift(it);
  const d = await idb();
  if (d) {
    try {
      await new Promise((res, rej) => {
        const t = d.transaction(['meta', 'blob'], 'readwrite');
        t.objectStore('meta').put(it); t.objectStore('blob').put(blob, it.id);
        t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    } catch (e) { it.mem = blob; }
  } else it.mem = blob;
  updateUI();
}
async function libBlob(it) {
  if (it.mem) return it.mem;
  const d = await idb();
  if (!d) return null;
  try { return await reqP(d.transaction('blob').objectStore('blob').get(it.id)); } catch (e) { return null; }
}
async function libDel(it) {
  S.lib = S.lib.filter(x => x !== it);
  const d = await idb();
  if (d && !it.mem) {
    try {
      await new Promise(res => {
        const t = d.transaction(['meta', 'blob'], 'readwrite');
        t.objectStore('meta').delete(it.id); t.objectStore('blob').delete(it.id);
        t.oncomplete = res; t.onerror = res; t.onabort = res;
      });
    } catch (e) { /* ignore */ }
  }
  updateUI();
}
async function addItem(kind, blob, w, h, thumb, dur) {
  const ts = Date.now();
  const ext = kind === 'video' ? (/mp4/.test(blob.type) ? 'mp4' : 'webm') : 'jpg';
  const it = { id: ts.toString(36) + Math.random().toString(36).slice(2, 6), kind, ts, w, h, look: S.lookId, name: fileNameFor(ext, ts), size: blob.size, thumb: thumb || '', dur: dur || 0, type: blob.type };
  await libAdd(it, blob);
  return it;
